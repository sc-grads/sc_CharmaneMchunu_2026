name: Database Deployment

on:
  workflow_dispatch:

jobs:

  devTest:
    name: Deploy to Dev/Test

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.LOCAL_SQL_SERVER }}
      port: ${{ vars.LOCAL_SQL_PORT }}
      database: master
      target_name: Dev/Test

    secrets:
      username: ${{ secrets.SQL_USERNAME }}
      password: ${{ secrets.SQL_PASSWORD }}

  notify:
    name: Notify Approval Required
    needs: devTest
    runs-on: ubuntu-latest

    steps:
      - name: Send Approval Request to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":"FFA500",
            "title":"⏳ Approval Required",
            "summary":"Database deployment awaiting approval",
            "sections":[
              {
                "facts":[
                  {
                    "name":"Repository",
                    "value":"${{ github.repository }}"
                  },
                  {
                    "name":"Environment",
                    "value":"Production"
                  },
                  {
                    "name":"Status",
                    "value":"Awaiting Approval"
                  }
                ]
              }
            ],
            "potentialAction":[
              {
                "@type":"OpenUri",
                "name":"Review Workflow",
                "targets":[
                  {
                    "os":"default",
                    "uri":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

  approval:
    name: Manual Approval
    needs: notify
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Await Approval
        run: |
          echo "Waiting for manual approval..."

  approval_granted:
    name: Notify Approval Granted
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - name: Send Approval Granted Notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":"00AA00",
            "title":"✅ Deployment Approved",
            "summary":"Approval granted for production deployment",
            "sections":[
              {
                "facts":[
                  {
                    "name":"Repository",
                    "value":"${{ github.repository }}"
                  },
                  {
                    "name":"Environment",
                    "value":"Production"
                  },
                  {
                    "name":"Status",
                    "value":"Approved"
                  }
                ]
              }
            ]
          }
          EOF

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

  production:
    name: Deploy to Production

    needs: approval_granted

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.PARTNER_SQL_SERVER }}
      port: ${{ vars.PARTNER_SQL_PORT }}
      database: master
      target_name: Production

    secrets:
      username: ${{ secrets.PARTNER_SQL_USERNAME }}
      password: ${{ secrets.PARTNER_SQL_PASSWORD }}

  deployment-success:
    name: Notify Deployment Success

    needs: production

    if: success()

    runs-on: ubuntu-latest

    steps:
      - name: Send Success Notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":"00AA00",
            "title":"✅ Database Deployment Successful",
            "summary":"Production deployment completed successfully",
            "sections":[
              {
                "facts":[
                  {
                    "name":"Repository",
                    "value":"${{ github.repository }}"
                  },
                  {
                    "name":"Target",
                    "value":"Production"
                  },
                  {
                    "name":"Status",
                    "value":"Success"
                  }
                ]
              }
            ],
            "potentialAction":[
              {
                "@type":"OpenUri",
                "name":"View Workflow",
                "targets":[
                  {
                    "os":"default",
                    "uri":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

  deployment-failure:
    name: Notify Deployment Failure

    needs: production

    if: failure()

    runs-on: ubuntu-latest

    steps:
      - name: Send Failure Notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          cat > payload.json <<EOF
          {
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":"FF0000",
            "title":"❌ Database Deployment Failed",
            "summary":"Production deployment failed",
            "sections":[
              {
                "facts":[
                  {
                    "name":"Repository",
                    "value":"${{ github.repository }}"
                  },
                  {
                    "name":"Target",
                    "value":"Production"
                  },
                  {
                    "name":"Status",
                    "value":"Failed"
                  }
                ]
              }
            ],
            "potentialAction":[
              {
                "@type":"OpenUri",
                "name":"View Workflow Logs",
                "targets":[
                  {
                    "os":"default",
                    "uri":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF

          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"
