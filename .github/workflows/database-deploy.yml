name: Database Deployment

on:
  workflow_dispatch:

jobs:

  deploy-local:
    name: Deploy to Local SQL Server

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.LOCAL_SQL_SERVER }}
      port: ${{ vars.LOCAL_SQL_PORT }}
      database: master
      target_name: Local SQL Server

    secrets:
      username: ${{ secrets.SQL_USERNAME }}
      password: ${{ secrets.SQL_PASSWORD }}

  notify:
    name: Notify Teams
    needs: deploy-local
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: |
          echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Create Teams Payload
        run: |
          cat > payload.json <<EOF
          {
            "@type":"MessageCard",
            "@context":"http://schema.org/extensions",
            "themeColor":"0078D7",
            "title":"🗄️ Local Database Deployment Completed",
            "summary":"Local SQL deployment successful",
            "sections":[
              {
                "facts":[
                  {
                    "name":"Repository",
                    "value":"${{ github.repository }}"
                  },
                  {
                    "name":"Status",
                    "value":"SUCCESS"
                  },
                  {
                    "name":"Time",
                    "value":"${{ steps.time.outputs.time }}"
                  }
                ]
              }
            ],
            "potentialAction":[
              {
                "@type":"OpenUri",
                "name":"View Workflow Run",
                "targets":[
                  {
                    "os":"default",
                    "uri":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

  approval:
    name: Manual Approval
    needs: notify
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Await Approval
        run: |
          echo "Waiting for manual approval..."

  deploy-partner:
    name: Deploy to Accountability Partner
    needs: approval

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.PARTNER_SQL_SERVER }}
      port: ${{ vars.PARTNER_SQL_PORT }}
      database: master
      target_name: Accountability Partner SQL Server

    secrets:
      username: ${{ secrets.PARTNER_SQL_USERNAME }}
      password: ${{ secrets.PARTNER_SQL_PASSWORD }}
