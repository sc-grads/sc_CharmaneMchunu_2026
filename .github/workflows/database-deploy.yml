name: Database Deployment

on:
  workflow_dispatch:

jobs:

  deploy-local:
    name: Deploy to Local SQL Server

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.LOCAL_SQL_SERVER }}
      port: ${{ vars.LOCAL_SQL_PORT }}
      database: CloudTunneling_CM
      target_name: Local SQL Server

    secrets:
      username: ${{ secrets.SQL_USERNAME }}
      password: ${{ secrets.SQL_PASSWORD }}

  notify:
    name: Notify Teams
    needs: deploy-local
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text":"Local deployment completed successfully. Approval is required before deploying to the accountability partner SQL Server."
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"

  approval:
    name: Manual Approval
    needs: notify
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Await Approval
        run: |
          echo "Waiting for manual approval..."

  deploy-partner:
    name: Deploy to Accountability Partner
    needs: approval

    uses: ./.github/workflows/deploy-template.yml

    with:
      server: ${{ vars.PARTNER_SQL_SERVER }}
      port: ${{ vars.PARTNER_SQL_PORT }}
      database: CloudTunneling_CM
      target_name: Accountability Partner SQL Server

    secrets:
      username: ${{ secrets.PARTNER_SQL_USERNAME }}
      password: ${{ secrets.PARTNER_SQL_PASSWORD }}
