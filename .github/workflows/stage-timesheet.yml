name: Deploy the migration project to the staging env using ngrok.

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: windows-latest

    environment: staging

    env:
      SQL_SERVER: ${{ vars.SQL_SERVER }}         
      SQL_PORT: ${{ vars.SQL_PORT }}              
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}   
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the project
        shell: cmd
        run: msbuild "SSIS-Project\TimesheetMigration\TimesheetMigration.slnx" /p:Configuration=Development

      - name: Check if ISPAC exists
        shell: powershell
        run: |
          $ispac = "SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          if (!(Test-Path $ispac)) { exit 1 }

      - name: Install sqlcmd
        shell: powershell
        run: |
          choco install mssql-tools -y
          refreshenv
          # Make sqlcmd available immediately
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Create database
        shell: powershell
        run: |
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -i Database\CreateDatabase.sql

      - name: Create tables
        shell: powershell
        run: |
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -i Database\CreateTable.sql

      - name: Create the SSIS catalog folder
        shell: powershell
        run: |
          $sql = @"
          IF NOT EXISTS (SELECT 1 FROM SSISDB.catalog.folders WHERE name = N'TimesheetMigration')
          BEGIN
              EXEC SSISDB.catalog.create_folder @folder_name = N'TimesheetMigration';
          END
          "@
          $sql | Out-File create-folder.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d SSISDB -i create-folder.sql -b

      - name: Deploy ISPAC package
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac")
          $hex = ($bytes | ForEach-Object { $_.ToString("X2") }) -join ""
          $sql = @"
          DECLARE @ProjectBinary VARBINARY(MAX) = 0x$hex;
          DECLARE @operation_id BIGINT;
          EXEC catalog.deploy_project
              @folder_name = N'TimesheetMigration',
              @project_name = N'TimesheetMigration',
              @project_stream = @ProjectBinary,
              @operation_id = @operation_id OUTPUT;
          "@
          $sql | Out-File deploy-ispac.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d SSISDB -i deploy-ispac.sql -b

      - name: Create SQL Agent job if missing
        shell: powershell
        run: |
          $jobName = "RunTimesheetDataPipeline"
          $server = "$env:SQL_SERVER,$env:SQL_PORT"

          $checkSql = "SELECT COUNT(*) FROM msdb.dbo.sysjobs WHERE name = N'$jobName'"
          $exists = sqlcmd -S $server -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d msdb -Q $checkSql -h-1 -W | ForEach-Object { $_.Trim() }

          if ($exists -eq "0") {
              Write-Host "Job does not exist. Creating it..."
              $template = Get-Content -Path "SQLAgent\CreateJob.sql" -Raw
              $template = $template -replace "<<SQL_SERVER>>", $server
              $template = $template -replace "<<JOB_NAME>>", $jobName
              $template = $template -replace "<<DATABASE_NAME>>", "TimesheetDB"
              $template = $template -replace "<SQL_SERVER>", $server
              $template = $template -replace "<JOB_NAME>", $jobName
              $template = $template -replace "<DATABASE_NAME>", "TimesheetDB"

              $tempFile = [System.IO.Path]::GetTempFileName() + ".sql"
              $template | Out-File -FilePath $tempFile -Encoding ASCII
              sqlcmd -S $server -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d msdb -i $tempFile -b
              Remove-Item -Path $tempFile -Force
          } else {
              Write-Host "Job already exists"
          }

      - name: Start/restart the job
        shell: powershell
        run: |
          $jobName = "RunTimesheetDataPipeline"
          $server = "$env:SQL_SERVER,$env:SQL_PORT"

          $runningQuery = @"
          SELECT 1
          FROM msdb.dbo.sysjobs j
          INNER JOIN msdb.dbo.sysjobactivity a ON j.job_id = a.job_id
          WHERE j.name = N'$jobName'
            AND a.run_requested_date IS NOT NULL
            AND a.stop_execution_date IS NULL
          "@
          $running = sqlcmd -S $server -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d msdb -Q $runningQuery -h-1 -W | ForEach-Object { $_.Trim() }

          if ($running -eq "1") {
              sqlcmd -S $server -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d msdb -Q "EXEC msdb.dbo.sp_stop_job @job_name = N'$jobName';"
              Start-Sleep -Seconds 3
          }

          sqlcmd -S $server -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d msdb -Q "EXEC msdb.dbo.sp_start_job @job_name = N'$jobName';"
