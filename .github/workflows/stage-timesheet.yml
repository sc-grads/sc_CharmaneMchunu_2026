name: Deployment (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy Database and SQL Agent
    runs-on: windows-latest

    environment: staging

    env:
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_PORT: ${{ vars.SQL_PORT }}
      DATABASE_NAME: ${{ vars.SQL_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Chocolatey and sqlcmd
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }
          choco install sqlcmd -y
          refreshenv

      - name: Verify sqlcmd
        shell: powershell
        run: sqlcmd -?

      - name: Debug Environment
        shell: powershell
        run: |
          Write-Host "SQL_SERVER: $env:SQL_SERVER"
          Write-Host "SQL_PORT: $env:SQL_PORT"
          Write-Host "DATABASE_NAME: $env:DATABASE_NAME"
          Write-Host "SQL_JOB_NAME (from vars): ${{ vars.SQL_JOB_NAME }}"

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateDatabase.sql"

      - name: Create Tables
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateTable.sql"

      - name: Create Stored Procedures
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/StoredProcedure.sql"

      - name: Create Triggers
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -i "Database/Triggers.sql"

      - name: Seed Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/SeedData.sql"

      - name: Create SQL Agent Job
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d msdb `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "SQLAgent/CreateJob.sql"

      # ------------------------------------------------------------------
      # Stop (if running) and start the SQL Agent Job using a temporary file
      # ------------------------------------------------------------------
      - name: Stop and Start SQL Agent Job
        shell: powershell
        run: |
          $JobName = "${{ vars.SQL_JOB_NAME }}"
          Write-Host "Managing job: $JobName"

          $sql = @"
          DECLARE @job_name NVARCHAR(128) = N'$JobName';
          DECLARE @job_id UNIQUEIDENTIFIER;

          SELECT @job_id = job_id FROM msdb.dbo.sysjobs WHERE name = @job_name;

          IF @job_id IS NOT NULL
          BEGIN
              IF EXISTS (
                  SELECT 1 FROM msdb.dbo.sysjobactivity
                  WHERE job_id = @job_id
                  AND start_execution_date IS NOT NULL
                  AND stop_execution_date IS NULL
              )
              BEGIN
                  RAISERROR('Job is running – stopping it...', 0, 1) WITH NOWAIT;
                  EXEC msdb.dbo.sp_stop_job @job_id = @job_id;
                  WAITFOR DELAY '00:00:03';
              END

              RAISERROR('Starting job...', 0, 1) WITH NOWAIT;
              EXEC msdb.dbo.sp_start_job @job_id = @job_id;
          END
          ELSE
          BEGIN
              RAISERROR('Job not found – create it first.', 16, 1);
          END
          "@

          # Write the SQL to a temporary file and run it with -i
          $tempFile = [System.IO.Path]::GetTempFileName() + ".sql"
          $sql | Out-File -FilePath $tempFile -Encoding ASCII
          try {
              sqlcmd -b `
                -S "$env:SQL_SERVER,$env:SQL_PORT" `
                -U "$env:SQL_USERNAME" `
                -P "$env:SQL_PASSWORD" `
                -d msdb `
                -i $tempFile
          } finally {
              Remove-Item $tempFile -Force -ErrorAction SilentlyContinue
          }

      - name: Deployment Complete
        run: echo "Database deployed and SQL Agent job '${{ vars.SQL_JOB_NAME }}' started successfully."
