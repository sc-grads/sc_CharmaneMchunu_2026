name: Deployment (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy Database and SQL Agent
    runs-on: windows-latest

    environment: staging

    env:
      SQL_SERVER: ${{ secrets.SQL_SERVER }}
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}

      SQL_PORT: ${{ vars.SQL_PORT }}
      DATABASE_NAME: ${{ vars.SQL_DATABASE }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        shell: powershell
        run: |
          choco install sqlcmd -y

      - name: Verify sqlcmd
        shell: powershell
        run: |
          sqlcmd -?

      ##########################################################
      # Create Database
      ##########################################################

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -v DATABASE_NAME="$env:SQL_DATABASE" `
          -i "Database/CreateDatabase.sql"

      ##########################################################
      # Create Tables
      ##########################################################

      - name: Create Tables
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -d "$env:DATABASE_NAME" `
          -v DATABASE_NAME="$env:DATABASE_NAME" `
          -i "Database/CreateTable.sql"

      ##########################################################
      # Stored Procedures
      ##########################################################

      - name: Create Stored Procedures
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -d "$env:DATABASE_NAME" `
          -v DATABASE_NAME="$env:DATABASE_NAME" `
          -i "Database/StoredProcedure.sql"

      ##########################################################
      # Triggers
      ##########################################################

      - name: Create Triggers
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -d "$env:DATABASE_NAME" `
          -v DATABASE_NAME="$env:DATABASE_NAME" `
          -i "Database/Triggers.sql"

      ##########################################################
      # Seed Data
      ##########################################################

      - name: Seed Database
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -d "$env:DATABASE_NAME" `
          -v DATABASE_NAME="$env:DATABASE_NAME" `
          -i "Database/SeedData.sql"

      ##########################################################
      # SQL Agent Job
      ##########################################################

      - name: Create SQL Agent Job
        shell: powershell
        run: |
          sqlcmd `
          -S "$env:SQL_SERVER,$env:SQL_PORT" `
          -U "$env:SQL_USERNAME" `
          -P "$env:SQL_PASSWORD" `
          -d msdb `
          -i "SQLAgent/CreateJob.sql"

      - name: Deployment Complete
        run: echo "Database and SQL Agent deployment completed successfully."
