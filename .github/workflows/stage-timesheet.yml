name: Deployment (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy Database and SQL Agent
    runs-on: windows-latest

    environment: staging

    env:
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_PORT: ${{ vars.SQL_PORT }}
      DATABASE_NAME: ${{ vars.SQL_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Chocolatey and sqlcmd
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }
          choco install sqlcmd -y
          refreshenv

      - name: Verify sqlcmd
        shell: powershell
        run: sqlcmd -?

      - name: Debug Environment
        shell: powershell
        run: |
          Write-Host "SQL_SERVER: $env:SQL_SERVER"
          Write-Host "SQL_PORT: $env:SQL_PORT"
          Write-Host "DATABASE_NAME: $env:DATABASE_NAME"
          Write-Host "SQL_JOB_NAME (from vars): ${{ vars.SQL_JOB_NAME }}"

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateDatabase.sql"

      - name: Create Tables
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateTable.sql"

      - name: Create Stored Procedures
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/StoredProcedure.sql"

      - name: Create Triggers
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -i "Database/Triggers.sql"

      - name: Seed Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/SeedData.sql"

      # ------------------------------------------------------------------
      # NEW: SSIS Package Deployment Steps
      # ------------------------------------------------------------------
      - name: Locate Visual Studio DevEnv Tool
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          if (-not $vsPath) { $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath }
          $devenvCom = Join-Path (Split-Path $vsPath) "devenv.com"
          echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build SSIS Project to ISPAC
        shell: powershell
        run: |
          # Adjust project path to match your repository structure
          $projectPath = "SSIS-Project\TimesheetMigration\TimesheetMigration.dtproj"
          if (-not (Test-Path $projectPath)) {
            Write-Error "Project file not found: $projectPath"
            exit 1
          }
          & "$env:DEVENV_PATH" $projectPath /Rebuild "Development"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Deploy ISPAC to SSISDB
        shell: powershell
        run: |
          $ispacPath = "SSIS-Project/TimesheetMigration/bin/Development/TimesheetMigration.ispac"
          if (-not (Test-Path $ispacPath)) {
            Write-Error "ISPAC not found at $ispacPath"
            exit 1
          }

          # Read ISPAC as binary and convert to hex string for T‑SQL
          $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

          $folderName = "TimesheetMigration"          # Adjust if needed
          $projectName = "TimesheetMigrationPipeline" # Should match your project name

          $sql = @"
          SET NOCOUNT ON;
          IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = '$folderName')
          BEGIN
              EXEC [SSISDB].[catalog].[create_folder] @folder_name = '$folderName';
          END

          DECLARE @project_binary VARBINARY(MAX) = $hexString;
          EXEC [SSISDB].[catalog].[deploy_project]
              @folder_name   = '$folderName',
              @project_name  = '$projectName',
              @project_stream = @project_binary;
          "@

          $tempSqlFile = Join-Path $env:RUNNER_TEMP "DeploySSIS.sql"
          $sql | Out-File -FilePath $tempSqlFile -Encoding utf8 -Force

          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -i $tempSqlFile

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SSIS deployment failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
      # ------------------------------------------------------------------

      - name: Create SQL Agent Job
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d msdb `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "SQLAgent/CreateJob.sql"

      # ------------------------------------------------------------------
      # Stop (if running) and start the SQL Agent Job using a temporary file
      # ------------------------------------------------------------------
      - name: Stop and Start SQL Agent Job
        shell: powershell
        run: |
          $JobName = "${{ vars.SQL_JOB_NAME }}"
          Write-Host "Managing job: $JobName"

          $sql = @"
          DECLARE @job_name NVARCHAR(128) = N'$JobName';
          DECLARE @job_id UNIQUEIDENTIFIER;

          SELECT @job_id = job_id FROM msdb.dbo.sysjobs WHERE name = @job_name;

          IF @job_id IS NOT NULL
          BEGIN
              IF EXISTS (
                  SELECT 1 FROM msdb.dbo.sysjobactivity
                  WHERE job_id = @job_id
                  AND start_execution_date IS NOT NULL
                  AND stop_execution_date IS NULL
              )
              BEGIN
                  RAISERROR('Job is running – stopping it...', 0, 1) WITH NOWAIT;
                  EXEC msdb.dbo.sp_stop_job @job_id = @job_id;
                  WAITFOR DELAY '00:00:03';
              END

              RAISERROR('Starting job...', 0, 1) WITH NOWAIT;
              EXEC msdb.dbo.sp_start_job @job_id = @job_id;
          END
          ELSE
          BEGIN
              RAISERROR('Job not found – create it first.', 16, 1);
          END
          "@

          $tempFile = [System.IO.Path]::GetTempFileName() + ".sql"
          $sql | Out-File -FilePath $tempFile -Encoding ASCII
          try {
              sqlcmd -b `
                -S "$env:SQL_SERVER,$env:SQL_PORT" `
                -U "$env:SQL_USERNAME" `
                -P "$env:SQL_PASSWORD" `
                -d msdb `
                -i $tempFile
          } finally {
              Remove-Item $tempFile -Force -ErrorAction SilentlyContinue
          }

      - name: Deployment Complete
        run: echo "Database deployed, SSIS package deployed, and SQL Agent job '${{ vars.SQL_JOB_NAME }}' started successfully."
