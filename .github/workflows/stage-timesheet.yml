name: Deploy TimesheetDB (Staging)

on:
  push:
    branches: [ staging ]          # ← trigger on staging
  workflow_dispatch:

jobs:
  deploy-and-migrate:
    name: Deploy TimesheetDB
    runs-on: windows-latest
    environment:
      name: staging                # ← staging environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Install sqlcmd and SSIS deployment tools ----
      - name: Install SQL Server tools
        run: |
          choco install sqlcmd -y --no-progress
          choco install sql-server-ssis -y --no-progress   # includes ISDeploymentWizard

      # ---- Deploy SSIS project using Publish-ISProject (supports SQL Auth) ----
      - name: Deploy SSIS project
        shell: pwsh
        run: |
          $ispacPath = Join-Path $env:GITHUB_WORKSPACE `
            "Projects 2026/TimesheetDataMigration/TimesheetsMigrationSSIS/bin/Development/TimesheetsMigrationSSIS.ispac"

          if (-not (Test-Path $ispacPath)) {
            Write-Error ".ispac not found at $ispacPath"
            exit 1
          }

          # Install the SqlServer module (includes Publish-ISProject)
          Install-Module -Name SqlServer -Force -Scope CurrentUser -AllowClobber
          Import-Module SqlServer -Force

          $server      = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user        = "${{ secrets.SQL_USERNAME }}"
          $pass        = "${{ secrets.SQL_PASSWORD }}"
          $folderName  = "TimesheetsMigration"
          $projectName = [System.IO.Path]::GetFileNameWithoutExtension($ispacPath)

          # Build a connection string for SSISDB
          $connString = "Data Source=$server;User ID=$user;Password=$pass;Initial Catalog=SSISDB;"

          Write-Host "Publishing $projectName to folder '$folderName'..."
          Publish-ISProject `
            -ProjectPath $ispacPath `
            -DestinationConnectionString $connString `
            -DestinationFolderName $folderName `
            -ProjectName $projectName

          if ($LASTEXITCODE -ne 0) {
            Write-Error "SSIS project deployment failed (exit code $LASTEXITCODE)"
            exit 1
          }
          Write-Host "SSIS project deployed successfully."

      # ---- Test connection (optional) ----
      - name: Test Connection
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -Q "SELECT @@SERVERNAME AS ServerName, @@VERSION AS Version"

      # ---- Deploy database objects ----
      - name: Deploy database tables
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -d master `
                   -i "./deploy-timesheetdb.sql"

      # ---- Run migration ----
      - name: Run spRunTimesheetMigration
        id: run_migration
        shell: pwsh
        run: |
          $result = & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                             -U "${{ secrets.SQL_USERNAME }}" `
                             -P "${{ secrets.SQL_PASSWORD }}" `
                             -d "${{ vars.SQL_DATABASE }}" `
                             -C `
                             -h -1 -W `
                             -Q "SET NOCOUNT ON; EXEC dbo.spRunTimesheetMigration;" 2>&1
          $lines = $result -split "`n" | Where-Object { $_.Trim() -ne "" }
          if ($lines.Count -eq 0) {
            Write-Error "No output from stored procedure"
            exit 1
          }
          $lastLine = $lines[-1].Trim()
          $parts = $lastLine -split "\s+", 2
          $exitCode = [int]$parts[0]
          $status   = if ($parts.Count -gt 1) { $parts[1] } else { "" }

          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "status=$status"      >> $env:GITHUB_OUTPUT

          if ($exitCode -ne 0) {
            Write-Error "Migration failed (ExitCode=$exitCode, Status=$status)"
            exit 1
          }
          Write-Host "Migration successful (ExitCode=$exitCode, Status=$status)"

      - name: Success confirmation
        if: success()
        run: echo "Deployment and migration completed successfully for staging."
