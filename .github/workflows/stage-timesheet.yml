name: Deployment (Staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy Database and SQL Agent
    runs-on: windows-latest

    environment: staging

    env:
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_PORT: ${{ vars.SQL_PORT }}
      DATABASE_NAME: ${{ vars.SQL_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Chocolatey and sqlcmd
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }
          choco install sqlcmd -y
          refreshenv
      - name: Verify sqlcmd
        shell: powershell
        run: sqlcmd -?

      - name: Debug Environment
        shell: powershell
        run: |
          Write-Host "SQL_SERVER: $env:SQL_SERVER"
          Write-Host "SQL_PORT: $env:SQL_PORT"
          Write-Host "DATABASE_NAME: $env:DATABASE_NAME"
          Write-Host "SQL_JOB_NAME (from vars): ${{ vars.SQL_JOB_NAME }}"
      - name: Create Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateDatabase.sql"
      - name: Create Tables
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/CreateTable.sql"
      - name: Create Stored Procedures
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/StoredProcedure.sql"
      - name: Create Triggers
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -i "Database/Triggers.sql"
      - name: Seed Database
        shell: powershell
        run: |
          sqlcmd -b `
            -S "$env:SQL_SERVER,$env:SQL_PORT" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -d "$env:DATABASE_NAME" `
            -v DATABASE_NAME="$env:DATABASE_NAME" `
            -i "Database/SeedData.sql"
      - name: Locate Visual Studio DevEnv Tool
        shell: powershell
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          if (-not $vsPath) { $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath }
          $devenvCom = Join-Path (Split-Path $vsPath) "devenv.com"
          echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build SSIS Project to ISPAC
        shell: powershell
        run: |
          $projectPath = "SSIS-Project\TimesheetMigration\TimesheetMigration.dtproj"
          if (-not (Test-Path $projectPath)) {
            Write-Error "Project file not found: $projectPath"
            exit 1
          }
          & "$env:DEVENV_PATH" $projectPath /Rebuild "Development"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
      # ==================== DEPLOY SSIS USING HELPER JOB WITH CmdExec ====================
      - name: Deploy SSIS via Helper Job (CmdExec)
        shell: pwsh
        run: |
          # 1. Locate ISPAC
          $ispacPath = "${{ github.workspace }}\SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          if (-not (Test-Path -Path $ispacPath)) {
              Write-Host "Primary path not found. Checking alternative..."
              $ispacPath = "${{ github.workspace }}\..\SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
              $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
          }
          if (-not (Test-Path -Path $ispacPath)) {
              Write-Error "CRITICAL ERROR: ISPAC not found."
              exit 1
          }
          Write-Host "Found ISPAC at: $ispacPath"
          # 2. Prepare variables
          $tunnelAddress = "$env:SQL_SERVER,$env:SQL_PORT"
          $dbUser        = "$env:SQL_USERNAME"
          $dbPassword    = "$env:SQL_PASSWORD"
          $folderName    = "TimesheetMigration"
          $projectName   = "TimesheetMigrationPipeline"
          # 3. Read and hex-encode ISPAC
          try {
              $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
              $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
          } catch {
              Write-Error "Failed to read ISPAC or convert to hex: $_"
              exit 1
          }
          # 4. Create a temporary .sql file with LITERAL sqlcmd placeholders.
          #    NOTE: this is a double-quoted here-string, so PowerShell will try to
          #    expand $(...) as a subexpression unless it's escaped with a backtick.
          #    Every $(folderName), $(projectName), $(HexString) below is escaped
          #    so it survives into the file as a literal sqlcmd scripting variable,
          #    to be substituted later by sqlcmd -v folderName=... -v projectName=... -v HexString=...
          $tempSql = Join-Path $env:TEMP "deploy_$([System.Guid]::NewGuid().ToString('N')).sql"
          @"
          USE SSISDB;
          IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = N'`$(folderName)')
          BEGIN
              EXEC [catalog].[create_folder] @folder_name = N'`$(folderName)';
          END
          DECLARE @project_stream VARBINARY(MAX) = `$(HexString);
          EXEC [catalog].[deploy_project]
              @folder_name = N'`$(folderName)',
              @project_name = N'`$(projectName)',
              @project_stream = @project_stream;
          "@ | Out-File -FilePath $tempSql -Encoding utf8
          Write-Host "Created temporary SQL file: $tempSql"
          # 5. Build the CmdExec command for the helper job
          #    sqlcmd -S . -E -d SSISDB -v folderName="..." -v projectName="..." -v HexString="..." -i "$tempSql"
          $cmdCommand = "sqlcmd -S . -E -d SSISDB -v folderName=`"$folderName`" -v projectName=`"$projectName`" -v HexString=`"$hexString`" -i `"$tempSql`""
          $helperJobName = "GitHub_SSIS_Deploy_Helper_CM"
          # 6. Create and start the helper job
          $createJobSql = @"
          USE [msdb];
          IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$helperJobName')
          BEGIN
              EXEC dbo.sp_delete_job @job_name = N'$helperJobName', @delete_unused_schedule=1;
          END
          EXEC dbo.sp_add_job @job_name = N'$helperJobName', @enabled = 1, @start_step_id = 1;
          EXEC dbo.sp_add_jobstep
              @job_name = N'$helperJobName',
              @step_name = N'Run Deploy',
              @subsystem = N'CmdExec',
              @command = N'$($cmdCommand -replace "'", "''")',
              @retry_attempts = 0;
          EXEC dbo.sp_add_jobserver
              @job_name = N'$helperJobName',
              @server_name = N'(local)';
          EXEC dbo.sp_start_job @job_name = N'$helperJobName';
          "@
          $connStr = "Data Source=$tunnelAddress;Initial Catalog=msdb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
              $connection.Open()
              $command = $connection.CreateCommand()
              $command.CommandText = $createJobSql
              $command.ExecuteNonQuery() | Out-Null
              Write-Host "Helper job started. Waiting 20 seconds for completion..."
          } catch {
              Write-Error "Failed to start helper job: $_"
              exit 1
          } finally {
              if ($connection.State -eq 'Open') { $connection.Close() }
          }
          # 7. Poll until the job finishes, then read its real outcome.
          #    NOTE: sysjobactivity has NO run_status column - it only tells you
          #    whether a job is currently executing (stop_execution_date IS NULL
          #    while running, populated once it stops). The actual pass/fail
          #    outcome lives in sysjobhistory, where step_id = 0 is the job-level
          #    summary row (run_status: 0=Failed, 1=Succeeded, 2=Retry, 3=Cancelled).
          $isRunningSql = @"
          USE [msdb];
          SELECT TOP 1 ja.stop_execution_date
          FROM msdb.dbo.sysjobactivity ja
          INNER JOIN msdb.dbo.sysjobs j ON ja.job_id = j.job_id
          WHERE j.name = N'$helperJobName'
          ORDER BY ja.start_execution_date DESC;
          "@
          $outcomeSql = @"
          USE [msdb];
          DECLARE @job_id UNIQUEIDENTIFIER = (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$helperJobName');
          SELECT TOP 1 run_status
          FROM msdb.dbo.sysjobhistory
          WHERE job_id = @job_id AND step_id = 0
          ORDER BY instance_id DESC;
          "@
          $maxWaitSeconds = 300
          $pollInterval = 5
          $elapsed = 0
          $finished = $false
          while ($elapsed -lt $maxWaitSeconds) {
              Start-Sleep -Seconds $pollInterval
              $elapsed += $pollInterval
              $pollConn = New-Object System.Data.SqlClient.SqlConnection($connStr)
              try {
                  $pollConn.Open()
                  $pollCmd = $pollConn.CreateCommand()
                  $pollCmd.CommandText = $isRunningSql
                  $stopDate = $pollCmd.ExecuteScalar()
                  if ($stopDate -ne $null -and $stopDate -isnot [DBNull]) {
                      $finished = $true
                  } else {
                      Write-Host "Still running... (${elapsed}s elapsed)"
                  }
              } catch {
                  Write-Error "Failed to poll job activity: $_"
                  exit 1
              } finally {
                  if ($pollConn.State -eq 'Open') { $pollConn.Close() }
              }
              if ($finished) { break }
          }
          if (-not $finished) {
              Write-Error "Helper job did not finish within $maxWaitSeconds seconds."
              exit 1
          }
          $statusConn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
              $statusConn.Open()
              $statusCmd = $statusConn.CreateCommand()
              $statusCmd.CommandText = $outcomeSql
              $runStatus = $statusCmd.ExecuteScalar()
              if ($null -eq $runStatus -or $runStatus -is [DBNull]) {
                  Write-Error "Could not retrieve job outcome from sysjobhistory."
                  exit 1
              }
              Write-Host "Job run_status: $runStatus (1=success, 0=fail, 2=retry, 3=cancelled)"
              if ($runStatus -ne 1) {
                  Write-Error "Helper job failed with status code $runStatus."
                  exit 1
              }
              Write-Host "Helper job succeeded."
          } catch {
              Write-Error "Failed to check job outcome: $_"
              exit 1
          } finally {
              if ($statusConn.State -eq 'Open') { $statusConn.Close() }
          }
          # 8. Clean up helper job
          $cleanupSql = @"
          USE [msdb];
          IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$helperJobName')
          BEGIN
              EXEC dbo.sp_delete_job @job_name = N'$helperJobName', @delete_unused_schedule=1;
          END
          "@
          $cleanConn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
              $cleanConn.Open()
              $cleanCmd = $cleanConn.CreateCommand()
              $cleanCmd.CommandText = $cleanupSql
              $cleanCmd.ExecuteNonQuery() | Out-Null
              Write-Host "Helper job deleted."
          } catch {
              Write-Warning "Cleanup failed: $_"
          } finally {
              if ($cleanConn.State -eq 'Open') { $cleanConn.Close() }
          }
          # 9. Verify project exists
          $verifySql = "SELECT COUNT(*) FROM SSISDB.catalog.projects WHERE folder_name = N'$folderName' AND name = N'$projectName';"
          $verifyConn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
              $verifyConn.Open()
              $verifyCmd = $verifyConn.CreateCommand()
              $verifyCmd.CommandText = $verifySql
              $count = $verifyCmd.ExecuteScalar()
              if ($count -eq 0) {
                  Write-Error "Project '$projectName' not found after deployment."
                  exit 1
              }
              Write-Host "Project verified successfully."
          } catch {
              Write-Error "Verification failed: $_"
              exit 1
          } finally {
              if ($verifyConn.State -eq 'Open') { $verifyConn.Close() }
          }
          # 10. Clean up temp file
          Remove-Item $tempSql -Force -ErrorAction SilentlyContinue
          Write-Host "SUCCESS: SSIS project deployed."
      # ==================== CREATE PERMANENT SCHEDULED JOB ====================
      - name: Create SQL Agent Job (T-SQL step)
        shell: pwsh
        run: |
          $tunnelAddress = "$env:SQL_SERVER,$env:SQL_PORT"
          $dbUser        = "$env:SQL_USERNAME"
          $dbPassword    = "$env:SQL_PASSWORD"
          $folderName    = "TimesheetMigration"
          $projectName   = "TimesheetMigrationPipeline"
          $packageName   = "Package.dtsx"
          $executionJobName = "${{ vars.SQL_JOB_NAME }}"
          $jobSql = @"
          USE [msdb];
          IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')
          BEGIN
              EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;
          END
          DECLARE @jobId BINARY(16);
          EXEC dbo.sp_add_job
              @job_name = N'$executionJobName',
              @enabled = 1,
              @description = N'Automated execution of TimesheetMigration SSIS package.',
              @category_name = N'[Uncategorized (Local)]',
              @owner_login_name = N'sa',
              @job_id = @jobId OUTPUT;
          DECLARE @run_command NVARCHAR(MAX);
          SET @run_command = N'
          DECLARE @execution_id BIGINT;
          EXEC [SSISDB].[catalog].[create_execution]
              @folder_name = N''$folderName'',
              @project_name = N''$projectName'',
              @package_name = N''$packageName'',
              @use32bitruntime = False,
              @execution_id = @execution_id OUTPUT;
          EXEC [SSISDB].[catalog].[set_execution_parameter_value]
              @execution_id,
              @object_type = 50,
              @parameter_name = N''LOGGING_LEVEL'',
              @parameter_value = 1;
          EXEC [SSISDB].[catalog].[start_execution] @execution_id;
          ';
          EXEC dbo.sp_add_jobstep
              @job_name = N'$executionJobName',
              @step_name = N'Execute SSIS Package',
              @subsystem = N'TSQL',
              @command = @run_command,
              @retry_attempts = 0;
          EXEC dbo.sp_add_jobserver
              @job_name = N'$executionJobName',
              @server_name = N'(local)';
          EXEC dbo.sp_add_jobschedule
              @job_name = N'$executionJobName',
              @name = N'Every30Seconds',
              @enabled = 1,
              @freq_type = 4,
              @freq_interval = 1,
              @freq_subday_type = 2,
              @freq_subday_interval = 30,
              @active_start_time = 000000,
              @active_end_time = 235959;
          "@
          $connStr = "Data Source=$tunnelAddress;Initial Catalog=msdb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
          $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
              $connection.Open()
              $command = $connection.CreateCommand()
              $command.CommandText = $jobSql
              $command.ExecuteNonQuery() | Out-Null
              Write-Host "SUCCESS: SQL Agent job '$executionJobName' created."
          } catch {
              Write-Error "Job creation failed: $_"
              exit 1
          } finally {
              if ($connection.State -eq 'Open') { $connection.Close() }
          }
      - name: Deployment Complete
        run: echo "Database deployed, SSIS deployed, and job '${{ vars.SQL_JOB_NAME }}' created with 30-second schedule."
