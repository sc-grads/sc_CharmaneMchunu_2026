name: Deploy Timesheet Migration Project - Staging Environment

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on:
      - self-hosted
      - runner-cm-pc

    environment: staging

    env:
      SQL_SERVER: ${{ secrets.SQL_SERVER }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SSIS Project
        shell: cmd
        run: |
          msbuild "SSIS-Project\TimesheetMigration\TimesheetMigration.slnx" /p:Configuration=Development

      - name: Verify ISPAC Exists
        shell: powershell
        run: |
          $ispac = "SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          if (!(Test-Path $ispac)) {
              Write-Error "ISPAC file not found."
              exit 1
          }
          Write-Host "ISPAC found."

      - name: Create Database
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -i Database\CreateDatabase.sql

      - name: Create Tables
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -i Database\CreateTable.sql

      - name: Create Stored Procedures
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -i Database\StoredProcedure.sql

      - name: Create Triggers
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -i Database\Triggers.sql

      - name: Seed Data
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -i Database\SeedData.sql

      - name: Create SSIS Catalog Folder
        shell: powershell
        run: |
          $sql = @"
          IF NOT EXISTS
          (
              SELECT 1
              FROM SSISDB.catalog.folders
              WHERE name = N'TimesheetMigration'
          )
          BEGIN
              EXEC SSISDB.catalog.create_folder
                  @folder_name = N'TimesheetMigration';
          END
          "@
          $sql | Out-File create-folder.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER" -E -d SSISDB -i create-folder.sql -b

      - name: Deploy ISPAC
        shell: powershell
        run: |
          $ispac = "SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          $bytes = [System.IO.File]::ReadAllBytes($ispac)
          $hex = ($bytes | ForEach-Object { $_.ToString("X2") }) -join ""
          $sql = @"
          DECLARE @ProjectBinary VARBINARY(MAX) = 0x$hex;
          DECLARE @operation_id BIGINT;
          EXEC catalog.deploy_project
              @folder_name = N'TimesheetMigration',
              @project_name = N'TimesheetMigration',
              @project_stream = @ProjectBinary,
              @operation_id = @operation_id OUTPUT;
          "@
          $sql | Out-File deploy-ispac.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER" -E -d SSISDB -i deploy-ispac.sql -b

      # ======== FIXED STEP ========
      - name: Create SQL Server Agent Job
        shell: powershell
        run: |
          # Read the template file
          $template = Get-Content -Path "SQLAgent\CreateJob.sql" -Raw

          # Replace placeholder tokens with actual values.
          # Adjust the token names to match exactly what is in your .sql file.
          # Example: replace <<SQL_SERVER>> with the actual server name.
          $template = $template -replace "<<SQL_SERVER>>", "$env:SQL_SERVER"
          # If the job name is also parameterised, replace it as well.
          $template = $template -replace "<<JOB_NAME>>", "RunTimesheetDataPipeline"
          # Add any other replacements your script needs (e.g. database name, etc.)

          # Write the processed script to a temporary file
          $tempFile = [System.IO.Path]::GetTempFileName() + ".sql"
          $template | Out-File -FilePath $tempFile -Encoding ASCII

          # Execute the script
          sqlcmd -S "$env:SQL_SERVER" -E -d msdb -i $tempFile -b

          # Clean up
          Remove-Item -Path $tempFile -Force

      - name: Start SQL Server Agent Job
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER% -E -d msdb -Q "EXEC msdb.dbo.sp_start_job @job_name='RunTimesheetDataPipeline';"

      - name: Deployment Complete
        shell: cmd
        run: |
          echo ========================================
          echo Staging deployment completed successfully.
          echo ========================================
