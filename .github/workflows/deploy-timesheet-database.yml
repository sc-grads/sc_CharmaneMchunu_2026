name: Deploy TimesheetDB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-migrate:
    name: Deploy TimesheetDB
    runs-on: windows-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Deploy SSIS project (with explicit assembly loading) ----
      - name: Deploy SSIS project (TimesheetsMigrationSSIS.ispac)
        shell: pwsh
        run: |
          $ispacPath = Join-Path $env:GITHUB_WORKSPACE `
            "Projects 2026/TimesheetDataMigration/TimesheetsMigrationSSIS/bin/Development/TimesheetsMigrationSSIS.ispac"

          if (-not (Test-Path $ispacPath)) {
            Write-Error ".ispac not found at $ispacPath"
            exit 1
          }

          # Install the SqlServer module (provides SMO)
          Install-Module -Name SqlServer -Force -Scope CurrentUser -AllowClobber

          # Locate the module folder (use latest version)
          $module = Get-Module -ListAvailable SqlServer | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) {
            Write-Error "SqlServer module not found after installation"
            exit 1
          }
          $modulePath = $module.ModuleBase
          Write-Host "SqlServer module resolved at: $modulePath"

          # Locate the SMO assembly (search recursively; exact subfolder varies by module version/PS host)
          $smoDll = Get-ChildItem -Path $modulePath -Recurse -Filter "Microsoft.SqlServer.Smo.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $smoDll) {
            Write-Error "Could not find Microsoft.SqlServer.Smo.dll under $modulePath"
            exit 1
          }

          # NOTE: newer versions of the SqlServer PS module (21.x/22.x) no longer bundle
          # Microsoft.SqlServer.Management.IntegrationServices.dll. Pull it from NuGet instead.
          $nugetDir = Join-Path $env:RUNNER_TEMP "iss-nuget"
          New-Item -ItemType Directory -Path $nugetDir -Force | Out-Null
          $nupkgPath = Join-Path $nugetDir "iss.zip"

          Write-Host "Downloading Microsoft.SqlServer.Management.IntegrationServices from NuGet..."
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.SqlServer.Management.IntegrationServices" -OutFile $nupkgPath -UseBasicParsing
          Expand-Archive -Path $nupkgPath -DestinationPath $nugetDir -Force

          $issDll = Get-ChildItem -Path $nugetDir -Recurse -Filter "Microsoft.SqlServer.Management.IntegrationServices.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $issDll) {
            Write-Error "Could not find Microsoft.SqlServer.Management.IntegrationServices.dll after NuGet download"
            exit 1
          }

          Write-Host "Loading assembly: $smoDll"
          Add-Type -Path $smoDll
          Write-Host "Loading assembly: $issDll"
          Add-Type -Path $issDll

          # Sanity check: confirm the type actually loaded before using it
          $typeLoaded = [System.AppDomain]::CurrentDomain.GetAssemblies() |
            Where-Object { $_.GetType('Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices', $false) } |
            Select-Object -First 1
          if (-not $typeLoaded) {
            Write-Error "IntegrationServices type still not loaded after Add-Type. Aborting."
            exit 1
          }

          # Build connection
          $server   = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user     = "${{ secrets.SQL_USERNAME }}"
          $pass     = "${{ secrets.SQL_PASSWORD }}"
          $connStr  = "Data Source=$server;Initial Catalog=SSISDB;User ID=$user;Password=$pass;"

          $smoServer = New-Object Microsoft.SqlServer.Management.Smo.Server($connStr)
          $ssis = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($smoServer)

          # Access the SSIS catalog
          $catalog = $ssis.Catalogs["SSISDB"]
          if (-not $catalog) {
            Write-Error "SSISDB catalog does not exist on the target server"
            exit 1
          }

          # Get or create the target folder
          $folderName = "TimesheetsMigration"
          $folder = $catalog.Folders[$folderName]
          if (-not $folder) {
            Write-Host "Creating folder '$folderName' in SSISDB..."
            $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $folderName)
            $folder.Create()
            Write-Host "Folder created."
          }

          Write-Host "Deploying $ispacPath to folder '$($folder.Name)'..."
          $folder.DeployProject($ispacPath)
          Write-Host "SSIS project deployed successfully."

      # ---- Install sqlcmd ----
      - name: Install sqlcmd
        run: choco install sqlcmd -y --no-progress

      # ---- Test connection ----
      - name: Test Connection
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -Q "SELECT @@SERVERNAME AS ServerName, @@VERSION AS Version"

      # ---- Deploy database objects ----
      - name: Deploy database tables
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -d master `
                   -i "./deploy-timesheetdb.sql"

      # ---- Run migration ----
      - name: Run spRunTimesheetMigration
        id: run_migration
        shell: pwsh
        run: |
          $result = & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                             -U "${{ secrets.SQL_USERNAME }}" `
                             -P "${{ secrets.SQL_PASSWORD }}" `
                             -d "${{ vars.SQL_DATABASE }}" `
                             -C `
                             -h -1 -W `
                             -Q "SET NOCOUNT ON; EXEC dbo.spRunTimesheetMigration;" 2>&1
          $lines = $result -split "`n" | Where-Object { $_.Trim() -ne "" }
          if ($lines.Count -eq 0) {
            Write-Error "No output from stored procedure"
            exit 1
          }
          $lastLine = $lines[-1].Trim()
          $parts = $lastLine -split "\s+", 2
          $exitCode = [int]$parts[0]
          $status   = if ($parts.Count -gt 1) { $parts[1] } else { "" }

          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "status=$status"      >> $env:GITHUB_OUTPUT

          if ($exitCode -ne 0) {
            Write-Error "Migration failed (ExitCode=$exitCode, Status=$status)"
            exit 1
          }
          Write-Host "Migration successful (ExitCode=$exitCode, Status=$status)"

      - name: Success confirmation
        if: success()
        run: echo "Deployment and migration completed successfully."
