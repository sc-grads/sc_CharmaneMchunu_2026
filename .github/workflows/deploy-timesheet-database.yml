name: Deploy TimesheetDB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-migrate:
    name: Deploy TimesheetDB
    runs-on: windows-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Deploy SSIS project using T-SQL (catalog.deploy_project)
      # ------------------------------------------------------------------
      - name: Deploy SSIS project (TimesheetsMigrationSSIS.ispac)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Path to the .ispac in the repo
          $ispacPath = Join-Path $env:GITHUB_WORKSPACE "Projects 2026/TimesheetDataMigration/TimesheetsMigrationSSIS/bin/Development/TimesheetsMigrationSSIS.ispac"
          if (-not (Test-Path $ispacPath)) {
            Write-Error ".ispac not found at $ispacPath"
            exit 1
          }

          # Project name = filename without extension
          $projectName = [System.IO.Path]::GetFileNameWithoutExtension($ispacPath)
          # Folder name in SSISDB (adjust if needed)
          $folderName  = "TimesheetsMigration"

          # Read the whole .ispac as bytes
          [byte[]]$ispacBytes = [System.IO.File]::ReadAllBytes($ispacPath)

          # Build the connection string (master or SSISDB – we need SSISDB for the catalog procs)
          $server   = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user     = "${{ secrets.SQL_USERNAME }}"
          $pass     = "${{ secrets.SQL_PASSWORD }}"
          $connStr  = "Data Source=$server;Initial Catalog=SSISDB;User ID=$user;Password=$pass;"

          # Open SQL connection
          $conn = New-Object System.Data.SqlClient.SqlConnection($connStr)
          try {
            $conn.Open()

            # -- 1. Ensure folder exists --
            $cmdCheckFolder = $conn.CreateCommand()
            $cmdCheckFolder.CommandText = "SELECT COUNT(1) FROM catalog.folders WHERE name = @folder"
            [void]$cmdCheckFolder.Parameters.AddWithValue("@folder", $folderName)
            $folderExists = [int]$cmdCheckFolder.ExecuteScalar()

            if ($folderExists -eq 0) {
              Write-Host "Creating SSISDB folder '$folderName'..."
              $cmdCreateFolder = $conn.CreateCommand()
              $cmdCreateFolder.CommandText = "catalog.create_folder"
              $cmdCreateFolder.CommandType = [System.Data.CommandType]::StoredProcedure
              [void]$cmdCreateFolder.Parameters.AddWithValue("@folder_name", $folderName)
              $cmdCreateFolder.ExecuteNonQuery()
              Write-Host "Folder created."
            }
            else {
              Write-Host "Folder '$folderName' already exists."
            }

            # -- 2. Deploy the project --
            Write-Host "Deploying $projectName to folder '$folderName'..."
            $cmdDeploy = $conn.CreateCommand()
            $cmdDeploy.CommandText = "catalog.deploy_project"
            $cmdDeploy.CommandType = [System.Data.CommandType]::StoredProcedure

            [void]$cmdDeploy.Parameters.AddWithValue("@folder_name", $folderName)
            [void]$cmdDeploy.Parameters.AddWithValue("@project_name", $projectName)
            # Important: pass the binary stream (SqlDbType.VarBinary, size -1)
            $paramStream = $cmdDeploy.Parameters.Add("@project_stream", [System.Data.SqlDbType]::VarBinary, -1)
            $paramStream.Value = $ispacBytes
            $outOpId = $cmdDeploy.Parameters.Add("@operation_id", [System.Data.SqlDbType]::BigInt)
            $outOpId.Direction = [System.Data.ParameterDirection]::Output

            $cmdDeploy.ExecuteNonQuery()

            # Optional: check operation result
            $operationId = $cmdDeploy.Parameters["@operation_id"].Value
            Write-Host "Deployment submitted. Operation ID = $operationId"

            # (You could add a loop to check operation_messages if desired)
            Write-Host "SSIS project deployed successfully."
          }
          finally {
            $conn.Dispose()
          }

      # ---- Install sqlcmd ----
      - name: Install sqlcmd
        run: choco install sqlcmd -y --no-progress

      # ---- Test connection ----
      - name: Test Connection
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -Q "SELECT @@SERVERNAME AS ServerName, @@VERSION AS Version"

      # ---- Deploy database objects ----
      - name: Deploy database tables
        shell: pwsh
        run: |
          & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                   -U "${{ secrets.SQL_USERNAME }}" `
                   -P "${{ secrets.SQL_PASSWORD }}" `
                   -C `
                   -d master `
                   -i "./deploy-timesheetdb.sql"

      # ---- Run migration ----
      - name: Run spRunTimesheetMigration
        id: run_migration
        shell: pwsh
        run: |
          $result = & sqlcmd -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
                             -U "${{ secrets.SQL_USERNAME }}" `
                             -P "${{ secrets.SQL_PASSWORD }}" `
                             -d "${{ vars.SQL_DATABASE }}" `
                             -C `
                             -h -1 -W `
                             -Q "SET NOCOUNT ON; EXEC dbo.spRunTimesheetMigration;" 2>&1
          $lines = $result -split "`n" | Where-Object { $_.Trim() -ne "" }
          if ($lines.Count -eq 0) {
            Write-Error "No output from stored procedure"
            exit 1
          }
          $lastLine = $lines[-1].Trim()
          $parts = $lastLine -split "\s+", 2
          $exitCode = [int]$parts[0]
          $status   = if ($parts.Count -gt 1) { $parts[1] } else { "" }

          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          "status=$status"      >> $env:GITHUB_OUTPUT

          if ($exitCode -ne 0) {
            Write-Error "Migration failed (ExitCode=$exitCode, Status=$status)"
            exit 1
          }
          Write-Host "Migration successful (ExitCode=$exitCode, Status=$status)"

      - name: Success confirmation
        if: success()
        run: echo "Deployment and migration completed successfully."
