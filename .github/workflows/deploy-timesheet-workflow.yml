name: Deploy Timesheet Migration Project - Production Environment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - runner-tg-pc

    environment: production

    env:
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_PORT: ${{ vars.SQL_PORT }}
      DATABASE_NAME: ${{ vars.SQL_DATABASE }}
      SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SSIS Project
        shell: cmd
        run: |
          msbuild "SSIS-Project\TimesheetMigration\TimesheetMigration.slnx" /p:Configuration=Development
      - name: Verify ISPAC Exists
        shell: powershell
        run: |
          $ispac = "SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          if (!(Test-Path $ispac)) {
              Write-Error "ISPAC file not found."
              exit 1
          }
          Write-Host "ISPAC found."
      - name: Create Database
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -i Database\CreateDatabase.sql
      - name: Create Tables
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d %DATABASE_NAME% -i Database\CreateTable.sql
      - name: Create Stored Procedures
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d %DATABASE_NAME% -i Database\StoredProcedure.sql
      - name: Create Triggers
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d %DATABASE_NAME% -i Database\Triggers.sql
      - name: Seed Data
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d %DATABASE_NAME% -i Database\SeedData.sql
      - name: Create SSIS Catalog Folder
        shell: powershell
        run: |
          $sql = @"
          IF NOT EXISTS
          (
              SELECT 1
              FROM SSISDB.catalog.folders
              WHERE name = N'TimesheetMigration'
          )
          BEGIN
              EXEC SSISDB.catalog.create_folder
                  @folder_name = N'TimesheetMigration';
          END
          "@
          $sql | Out-File create-folder.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d SSISDB -i create-folder.sql -b
      - name: Deploy ISPAC
        shell: powershell
        run: |
          $ispac = "SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac"
          $bytes = [System.IO.File]::ReadAllBytes($ispac)
          $hex = ($bytes | ForEach-Object { $_.ToString("X2") }) -join ""
          $sql = @"
          DECLARE @ProjectBinary VARBINARY(MAX) = 0x$hex;
          DECLARE @operation_id BIGINT;
          EXEC catalog.deploy_project
              @folder_name = N'TimesheetMigration',
              @project_name = N'TimesheetMigration',
              @project_stream = @ProjectBinary,
              @operation_id = @operation_id OUTPUT;
          "@
          $sql | Out-File deploy-ispac.sql -Encoding ASCII
          sqlcmd -S "$env:SQL_SERVER,$env:SQL_PORT" -U "$env:SQL_USERNAME" -P "$env:SQL_PASSWORD" -d SSISDB -i deploy-ispac.sql -b
      - name: Create SQL Server Agent Job
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d msdb -i SQLAgent\CreateJob.sql
      - name: Start SQL Server Agent Job
        shell: cmd
        run: |
          sqlcmd -S %SQL_SERVER%,%SQL_PORT% -U %SQL_USERNAME% -P %SQL_PASSWORD% -d msdb -Q "EXEC msdb.dbo.sp_start_job @job_name='RunTimesheetDataPipeline';"
      - name: Deployment Complete
        shell: cmd
        run: |
          echo ========================================
          echo Deployment completed successfully.
          echo ========================================