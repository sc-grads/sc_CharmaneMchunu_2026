name: Deploy website

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Github-Actions/02-Starting-Project

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Test code
        run: npm run test


  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Github-Actions/02-Starting-Project

    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Publish JS filename
        id: publish
        run: |
          FILE=$(ls dist/assets/*.js | head -n 1)
          echo "script-file=$FILE" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: ./Github-Actions/02-Starting-Project/dist


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: List files
        run: ls -R

      - name: Deploy
        run: echo "Deploying ..."
