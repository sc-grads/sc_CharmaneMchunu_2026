name: Deployment (Production) - runner-tg-pc

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Database and SQL Agent
    runs-on: runner-tg-pc                     # Your self-hosted runner label
    environment: production                   # Uses environment variables/secrets

    env:
      # ----- SQL Server connection (from GitHub environment variables) -----
      SQL_SERVER: ${{ vars.SQL_SERVER }}      # e.g., "localhost" or "SQL01"
      DATABASE_NAME: ${{ vars.SQL_DATABASE }} # Target database for schema

      # ----- SSIS project settings (adjust to your actual names) -----
      SSIS_FOLDER: TimesheetProductionMigration
      SSIS_PROJECT: TimesheetMigrationTwo
      SSIS_PACKAGE: TimesheetProductionMigrationPK.dtsx
      SQL_AGENT_JOB: ${{ vars.SQL_JOB_NAME }} # e.g., "TimesheetMigrationETL"

      # Path to your .dtproj file (relative to repo root)
      SSIS_PROJECT_PATH: SSIS-Project\TimesheetMigrationTwo\TimesheetMigrationTwo.dtproj

      # If you need SQL authentication, uncomment the lines below and set secrets
      # SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
      # SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Ensure SqlServer PowerShell module is available
      # ------------------------------------------------------------------
      - name: Ensure SqlServer PowerShell Module
        shell: powershell
        run: |
          if (Get-Module -Name SQLPS) {
              Remove-Module SQLPS -Force -ErrorAction SilentlyContinue
          }

          if (!(Get-Module -ListAvailable -Name SqlServer)) {
              Write-Host "SqlServer module not found. Installing..."

              Install-PackageProvider `
                -Name NuGet `
                -Force `
                -Scope CurrentUser

              Set-PSRepository `
                -Name PSGallery `
                -InstallationPolicy Trusted

              Install-Module `
                -Name SqlServer `
                -Scope CurrentUser `
                -Force `
                -AllowClobber
          }

          Import-Module SqlServer -Force -DisableNameChecking

          Write-Host "SqlServer module is ready."
          Get-Command Invoke-Sqlcmd

      # ------------------------------------------------------------------
      # 2. Sync Excel files from repo to C:\Timesheets
      # ------------------------------------------------------------------
      - name: Sync Excel files to C:\Timesheets
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          try {
            $sourceFolder = "${{ github.workspace }}\Timesheets"
            $targetFolder = "C:\Timesheets"

            Write-Host '========================================'
            Write-Host "Runner Machine : $env:COMPUTERNAME"
            Write-Host "Source Folder : $sourceFolder"
            Write-Host "Target Folder : $targetFolder"
            Write-Host '========================================'

            # Create target if missing
            if (-not (Test-Path -Path $targetFolder)) {
                Write-Host 'Creating target folder...'
                New-Item -ItemType Directory -Path $targetFolder -Force | Out-Null
            }

            # Validate source
            if (-not (Test-Path -Path $sourceFolder)) {
                Write-Error "Source folder '$sourceFolder' not found!"
                Write-Host 'Available folders in repo root:'
                Get-ChildItem -Path "${{ github.workspace }}" -Directory | Select-Object Name
                exit 1
            }

            # List source before sync
            Write-Host ''
            Write-Host '========================================'
            Write-Host '[SOURCE] FOLDER CONTENTS (before sync):'
            Write-Host '========================================'
            Get-ChildItem -Path $sourceFolder -Force -Recurse |
                Select-Object FullName, Length, LastWriteTime, @{Name='Type';Expression={if ($_.PSIsContainer) {'Directory'} else {'File'}}} |
                Format-Table -AutoSize

            # Sync with robocopy (mirror)
            Write-Host ''
            Write-Host '========================================'
            Write-Host "Syncing files from '$sourceFolder' to '$targetFolder'..."
            Write-Host '========================================'
            $robocopyArgs = @(
                "`"$sourceFolder`"",
                "`"$targetFolder`"",
                '/MIR',
                '/Z',
                '/NP',
                '/NDL',
                '/R:2',
                '/W:5'
            )
            & robocopy @robocopyArgs

            $rc = $LASTEXITCODE
            if ($rc -ge 8) {
                Write-Error "Robocopy failed with exit code $rc"
                exit 1
            }
            Write-Host ''
            Write-Host "Sync completed successfully! (Robocopy exit code: $rc)"

            # List target after sync
            Write-Host ''
            Write-Host '========================================'
            Write-Host '[TARGET] FOLDER CONTENTS (after sync):'
            Write-Host '========================================'
            Get-ChildItem -Path $targetFolder -Force -Recurse |
                Select-Object FullName, Length, LastWriteTime, @{Name='Type';Expression={if ($_.PSIsContainer) {'Directory'} else {'File'}}} |
                Format-Table -AutoSize

            $totalFiles = (Get-ChildItem -Path $targetFolder -File -Recurse).Count
            $totalFolders = (Get-ChildItem -Path $targetFolder -Directory -Recurse).Count
            Write-Host ''
            Write-Host '========================================'
            Write-Host 'SUMMARY:'
            Write-Host "   Total folders: $totalFolders"
            Write-Host "   Total files:   $totalFiles"
            Write-Host '========================================'

            $LASTEXITCODE = 0
            exit 0
          }
          catch {
            Write-Error "Script error: $_"
            exit 1
          }

      # ------------------------------------------------------------------
      # 3. Deploy database schema (using your SQL scripts from Database/)
      # ------------------------------------------------------------------
      - name: Deploy Database Schema
        shell: powershell
        run: |
          Import-Module SqlServer -Force -DisableNameChecking

          $server = $env:SQL_SERVER
          $database = $env:DATABASE_NAME

          # Build connection string – Integrated Security (Windows auth)
          $connString = "Server=$server;Database=master;Integrated Security=True;TrustServerCertificate=True;"
          # If you need SQL authentication, replace with:
          # $connString = "Server=$server;Database=master;User ID=$env:SQL_USERNAME;Password=$env:SQL_PASSWORD;TrustServerCertificate=True;"

          # List of SQL files in order of dependency
          $sqlFiles = @(
            "Database/CreateDatabase.sql",
            "Database/CreateTable.sql",
            "Database/StoredProcedure.sql",
            "Database/Triggers.sql",
            "Database/SeedData.sql"
          )

          foreach ($file in $sqlFiles) {
            $fullPath = Join-Path -Path ${{ github.workspace }} -ChildPath $file
            if (Test-Path $fullPath) {
              Write-Host "Executing $file ..."
              $script = Get-Content -Path $fullPath -Raw
              Invoke-Sqlcmd -ConnectionString $connString -Query $script -ErrorAction Stop
            } else {
              Write-Warning "Skipping missing file: $file"
            }
          }

          Write-Host "Database schema deployed successfully."

      # ------------------------------------------------------------------
      # 4. Build SSIS project to ISPAC
      # ------------------------------------------------------------------
      - name: Build SSIS Project Into ISPAC
        shell: powershell
        run: |
          if (!(Test-Path $env:SSIS_PROJECT_PATH)) {
              throw "SSIS project file not found: $env:SSIS_PROJECT_PATH"
          }

          # Locate devenv.com / devenv.exe
          $devenv = Get-ChildItem `
            -Path "C:\Program Files\Microsoft Visual Studio" `
            -Recurse `
            -Filter "devenv.com" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (!$devenv) {
              $devenvExe = Get-ChildItem `
                -Path "C:\Program Files\Microsoft Visual Studio" `
                -Recurse `
                -Filter "devenv.exe" `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1

              if (!$devenvExe) {
                  throw "devenv.com/devenv.exe not found. Full Visual Studio with SSIS Projects support must be installed on this runner."
              }
              $devenvPath = $devenvExe.FullName
          } else {
              $devenvPath = $devenv.FullName
          }

          Write-Host "Using Visual Studio: $devenvPath"

          & $devenvPath $env:SSIS_PROJECT_PATH /Build Development

          if ($LASTEXITCODE -ne 0) {
              throw "SSIS project build failed."
          }

          Write-Host "SSIS project built successfully."

      - name: Validate ISPAC Exists
        shell: powershell
        run: |
          $ispac = Get-ChildItem `
            -Path "SSIS-Project" `
            -Recurse `
            -Filter "*.ispac" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$ispac) {
              throw "ISPAC file was not generated."
          }

          Write-Host "ISPAC found: $($ispac.FullName)"

          "ISPAC_PATH=$($ispac.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ------------------------------------------------------------------
      # 5. Deploy ISPAC to SSISDB catalog (direct)
      # ------------------------------------------------------------------
      - name: Create SSIS Folder If Missing
        shell: powershell
        run: |
          Import-Module SqlServer -Force -DisableNameChecking

          $folder = $env:SSIS_FOLDER.Replace("'", "''")
          $server = $env:SQL_SERVER
          $connString = "Server=$server;Database=SSISDB;Integrated Security=True;TrustServerCertificate=True;"
          # For SQL auth, replace with User ID/Password as above

          $sql = @"
          IF NOT EXISTS (
              SELECT 1
              FROM catalog.folders
              WHERE name = N'$folder'
          )
          BEGIN
              EXEC catalog.create_folder
                  @folder_name = N'$folder';

              PRINT 'SSIS folder created.';
          END
          ELSE
          BEGIN
              PRINT 'SSIS folder already exists.';
          END
          "@

          Invoke-Sqlcmd -ConnectionString $connString -Query $sql -ErrorAction Stop

      - name: Deploy ISPAC to SSISDB
        shell: powershell
        run: |
          if (!(Test-Path $env:ISPAC_PATH)) {
              throw "ISPAC path is invalid: $env:ISPAC_PATH"
          }

          $projectBytes = [System.IO.File]::ReadAllBytes($env:ISPAC_PATH)

          $server = $env:SQL_SERVER
          $connString = "Server=$server;Database=SSISDB;Integrated Security=True;TrustServerCertificate=True;"

          $connection = New-Object System.Data.SqlClient.SqlConnection
          $connection.ConnectionString = $connString
          $connection.Open()

          try {
              $command = $connection.CreateCommand()
              $command.CommandTimeout = 0

              $command.CommandText = "
              EXEC catalog.deploy_project
                  @folder_name = @FolderName,
                  @project_name = @ProjectName,
                  @project_stream = @ProjectStream;
              "

              $command.Parameters.Add("@FolderName", [System.Data.SqlDbType]::NVarChar, 128).Value = $env:SSIS_FOLDER
              $command.Parameters.Add("@ProjectName", [System.Data.SqlDbType]::NVarChar, 128).Value = $env:SSIS_PROJECT
              $command.Parameters.Add("@ProjectStream", [System.Data.SqlDbType]::VarBinary, -1).Value = $projectBytes

              $command.ExecuteNonQuery()

              Write-Host "SSIS project deployed or redeployed successfully."
          }
          finally {
              $connection.Close()
          }

      # ------------------------------------------------------------------
      # 6. Create/Update SQL Agent Job with schedule (every 30 seconds)
      # ------------------------------------------------------------------
      - name: Create SQL Agent Job And Schedule
        shell: powershell
        run: |
          Import-Module SqlServer -Force -DisableNameChecking

          $jobName = $env:SQL_AGENT_JOB.Replace("'", "''")
          $folder = $env:SSIS_FOLDER.Replace("'", "''")
          $project = $env:SSIS_PROJECT.Replace("'", "''")
          $package = $env:SSIS_PACKAGE.Replace("'", "''")
          $scheduleName = "$jobName Every 30 Seconds"
          $scheduleNameSql = $scheduleName.Replace("'", "''")

          $jobStepCommand = @"
          DECLARE @execution_id BIGINT;

          EXEC SSISDB.catalog.create_execution
              @folder_name = N'$folder',
              @project_name = N'$project',
              @package_name = N'$package',
              @execution_id = @execution_id OUTPUT;

          EXEC SSISDB.catalog.start_execution
              @execution_id = @execution_id;
          "@

          $jobStepCommand = $jobStepCommand.Replace("'", "''")

          $server = $env:SQL_SERVER
          $connString = "Server=$server;Database=msdb;Integrated Security=True;TrustServerCertificate=True;"

          $sql = @"
          USE msdb;

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysjobs
              WHERE name = N'$jobName'
          )
          BEGIN
              EXEC dbo.sp_add_job
                  @job_name = N'$jobName',
                  @enabled = 1,
                  @description = N'Runs the Timesheet ETL package from SSISDB.';

              EXEC dbo.sp_add_jobserver
                  @job_name = N'$jobName';

              PRINT 'SQL Server Agent job created.';
          END
          ELSE
          BEGIN
              EXEC dbo.sp_update_job
                  @job_name = N'$jobName',
                  @enabled = 1;

              PRINT 'SQL Server Agent job already exists. Job enabled.';
          END

          IF EXISTS (
              SELECT 1
              FROM dbo.sysjobsteps js
              INNER JOIN dbo.sysjobs j
                  ON js.job_id = j.job_id
              WHERE j.name = N'$jobName'
                AND js.step_id = 1
          )
          BEGIN
              EXEC dbo.sp_update_jobstep
                  @job_name = N'$jobName',
                  @step_id = 1,
                  @step_name = N'Run SSIS Package From SSISDB',
                  @subsystem = N'TSQL',
                  @database_name = N'master',
                  @command = N'$jobStepCommand',
                  @on_success_action = 1,
                  @on_fail_action = 2;

              PRINT 'SQL Server Agent job step updated.';
          END
          ELSE
          BEGIN
              EXEC dbo.sp_add_jobstep
                  @job_name = N'$jobName',
                  @step_name = N'Run SSIS Package From SSISDB',
                  @subsystem = N'TSQL',
                  @database_name = N'master',
                  @command = N'$jobStepCommand',
                  @on_success_action = 1,
                  @on_fail_action = 2;

              PRINT 'SQL Server Agent job step created.';
          END

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysschedules
              WHERE name = N'$scheduleNameSql'
          )
          BEGIN
              EXEC dbo.sp_add_schedule
                  @schedule_name = N'$scheduleNameSql',
                  @enabled = 1,
                  @freq_type = 4,
                  @freq_interval = 1,
                  @freq_subday_type = 2,
                  @freq_subday_interval = 30,
                  @active_start_time = 000000;

              PRINT 'Schedule created: every 30 seconds.';
          END
          ELSE
          BEGIN
              EXEC dbo.sp_update_schedule
                  @name = N'$scheduleNameSql',
                  @enabled = 1,
                  @freq_type = 4,
                  @freq_interval = 1,
                  @freq_subday_type = 2,
                  @freq_subday_interval = 30,
                  @active_start_time = 000000;

              PRINT 'Schedule updated: every 30 seconds.';
          END

          IF NOT EXISTS (
              SELECT 1
              FROM dbo.sysjobs j
              INNER JOIN dbo.sysjobschedules js
                  ON j.job_id = js.job_id
              INNER JOIN dbo.sysschedules s
                  ON js.schedule_id = s.schedule_id
              WHERE j.name = N'$jobName'
                AND s.name = N'$scheduleNameSql'
          )
          BEGIN
              EXEC dbo.sp_attach_schedule
                  @job_name = N'$jobName',
                  @schedule_name = N'$scheduleNameSql';

              PRINT 'Schedule attached to job.';
          END
          ELSE
          BEGIN
              PRINT 'Schedule already attached to job.';
          END
          "@

          Invoke-Sqlcmd -ConnectionString $connString -Query $sql -ErrorAction Stop

      - name: Validate SQL Agent Job
        shell: powershell
        run: |
          Import-Module SqlServer -Force -DisableNameChecking

          $jobName = $env:SQL_AGENT_JOB.Replace("'", "''")
          $server = $env:SQL_SERVER
          $connString = "Server=$server;Database=msdb;Integrated Security=True;TrustServerCertificate=True;"

          Invoke-Sqlcmd -ConnectionString $connString -Query "
          SELECT 
              j.name AS JobName,
              j.enabled AS JobEnabled,
              s.name AS ScheduleName,
              s.enabled AS ScheduleEnabled,
              s.freq_subday_interval AS RunsEvery,
              CASE s.freq_subday_type
                  WHEN 2 THEN 'Seconds'
                  WHEN 4 THEN 'Minutes'
                  WHEN 8 THEN 'Hours'
                  ELSE 'Other'
              END AS IntervalType,
              a.start_execution_date,
              a.stop_execution_date,
              CASE 
                  WHEN a.start_execution_date IS NOT NULL 
                   AND a.stop_execution_date IS NULL 
                  THEN 'Running'
                  ELSE 'Not currently running'
              END AS CurrentStatus
          FROM dbo.sysjobs j
          LEFT JOIN dbo.sysjobschedules js
              ON j.job_id = js.job_id
          LEFT JOIN dbo.sysschedules s
              ON js.schedule_id = s.schedule_id
          LEFT JOIN dbo.sysjobactivity a
              ON j.job_id = a.job_id
          WHERE j.name = N'$jobName'
          ORDER BY a.start_execution_date DESC;
          " -ErrorAction Stop

      - name: Deployment Complete
        run: |
          echo "========================================="
          echo "All steps completed successfully!"
          echo "Database deployed."
          echo "Excel files synced to C:\Timesheets."
          echo "SSIS project deployed to SSISDB."
          echo "SQL Agent job '${{ env.SQL_AGENT_JOB }}' created with 30-second schedule."
          echo "========================================="
