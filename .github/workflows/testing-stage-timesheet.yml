name: Deploy Timesheet Pipeline (TESTING STAGING)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: windows-latest

    environment: staging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install SSDT for Visual Studio 2022
        shell: powershell
        run: |
          $url = "https://aka.ms/ssdt-msi"
          $installer = "ssdt.msi"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process msiexec -Wait -ArgumentList "/i $installer /quiet /norestart"


      - name: Build SSIS Project
        shell: powershell
        run: |
          # Locate the latest MSBuild
          $msbuild = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -find "MSBuild\Current\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            # Fallback if vswhere fails
            $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          }
          Write-Host "Using MSBuild: $msbuild"
          # Build the solution – adjust the file name/extension if needed
          & $msbuild "SSIS-Project\TimesheetMigration\TimesheetMigration.slnx" /p:Configuration=Development

      - name: Deploy ISPAC to SSISDB
        shell: powershell
        run: |
          $server = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          & "C:\Program Files (x86)\Microsoft SQL Server\150\DTS\Binn\ISDeploymentWizard.exe" `
            /Silent `
            /ModelType:Project `
            /SourcePath:"SSIS-Project\TimesheetMigration\bin\Development\TimesheetMigration.ispac" `
            /DestinationServerName:$server `
            /DestinationFolder:"TimesheetDataPipeline"

      - name: Start SQL Agent Job
        shell: powershell
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
                 -U "${{ secrets.SQL_USERNAME }}" `
                 -P "${{ secrets.SQL_PASSWORD }}" `
                 -Q "EXEC msdb.dbo.sp_start_job @job_name = 'RunTimesheetDataPipeline';"


      - name: Monitor Job Execution
        shell: powershell
        run: |
          $server = "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}"
          $user = "${{ secrets.SQL_USERNAME }}"
          $pass = "${{ secrets.SQL_PASSWORD }}"
          for ($i = 0; $i -lt 60; $i++) {
              $result = sqlcmd -S $server -U $user -P $pass -h -1 -W -Q "
              SELECT TOP 1 run_status
              FROM msdb.dbo.sysjobhistory h
              JOIN msdb.dbo.sysjobs j ON j.job_id = h.job_id
              WHERE j.name = 'RunTimesheetDataPipeline'
              ORDER BY h.instance_id DESC;
              "
              $status = $result.Trim()
              if ($status -eq "1") { Write-Host "Job succeeded!"; exit 0 }
              if ($status -eq "3") { Write-Host "Job failed!"; exit 1 }
              Start-Sleep -Seconds 10
          }
          Write-Host "Job did not finish within 10 minutes."
          exit 1
