name: SQL Deployment Template
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      database:
        required: true
        type: string
      target_name:
        required: true
        type: string
jobs:
  deploy:
    name: Deploy to ${{ inputs.target_name }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Add SQLCMD to PATH
        run: echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Verify SQL Script Exists
        run: |
          echo "Repository contents:"
          ls -la
          echo ""
          echo "SQL Project contents:"
          ls -la "Projects 2026/SQL Project"
          echo ""
          echo "Deployment script found:"
          test -f "Projects 2026/SQL Project/deploy.sql"

      - name: Display Deployment Information
        run: |
          echo "================================="
          echo "Deployment Starting"
          echo "Target:    ${{ inputs.target_name }}"
          echo "Server:    ${{ vars.SQL_SERVER }}"
          echo "Port:      ${{ vars.SQL_PORT }}"
          echo "Database:  ${{ inputs.database }}"
          echo "================================="

      - name: Debug Environment Values
        env:
          USERNAME: ${{ secrets.SQL_USERNAME }}
          PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          echo "Server:          ${{ vars.SQL_SERVER }}"
          echo "Port:            ${{ vars.SQL_PORT }}"
          echo "Username length: ${#USERNAME}"
          echo "Password length: ${#PASSWORD}"

      - name: Test SQL Connection
        run: |
          sqlcmd \
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" \
            -U "${{ secrets.SQL_USERNAME }}" \
            -P "${{ secrets.SQL_PASSWORD }}" \
            -C \
            -Q "SELECT @@SERVERNAME AS ServerName, @@VERSION AS Version"

      - name: Deploy Database
        run: |
          sqlcmd \
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" \
            -U "${{ secrets.SQL_USERNAME }}" \
            -P "${{ secrets.SQL_PASSWORD }}" \
            -d "${{ inputs.database }}" \
            -C \
            -b \
            -i "Projects 2026/SQL Project/deploy.sql"

      - name: Deployment Complete
        if: success()
        run: |
          echo "================================="
          echo "✅ Deployment Successful"
          echo "Target:    ${{ inputs.target_name }}"
          echo "Server:    ${{ vars.SQL_SERVER }}"
          echo "Database:  ${{ inputs.database }}"
          echo "================================="

      - name: Deployment Failed
        if: failure()
        run: |
          echo "================================="
          echo "❌ Deployment Failed"
          echo "Target:    ${{ inputs.target_name }}"
          echo "Server:    ${{ vars.SQL_SERVER }}"
          echo "Database:  ${{ inputs.database }}"
          echo "Check the Deploy Database step above for error details."
          echo "================================="
