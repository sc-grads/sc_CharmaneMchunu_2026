name: Events Demo 1
on: 
    pull_request:
        types:
            - opened

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: Output Github context
            run: echo "${{ toJson(github.event) }}"
          - name: Get Code
            uses: actions/checkout@v3
          - name: Install dependencies
            run: npm ci
          - name: Test code
            run: npm run test   
          - name: Build code
            run: npm run build
          - name: Deploy code
            run: echo "Deploying ..."